<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Metacraft — Squads sob demanda, prontas para performar</title>
    <meta name="description"
        content="Metacraft: squads de tecnologia sob demanda, treinadas exatamente na stack e no ambiente do cliente. Alta performance desde o primeiro dia, com continuidade garantida." />
    <meta name="theme-color" content="#0E2336" />
    <meta property="og:title" content="Metacraft — Squads sob demanda, prontas para performar" />
    <meta property="og:description" content="Times já treinados na sua stack, entregando desde o primeiro dia." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="assets/logo2.png" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />

    <!-- CSS separado -->
    <link rel="stylesheet" href="style.css" />

    <!-- JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Metacraft",
        "url": "https://www.metacraftbr.com",
        "logo": "assets/logo2.png",
        "sameAs": ["https://www.linkedin.com/company/metacraft"],
        "contactPoint": [
          {
            "@type": "ContactPoint",
            "telephone": "+55-11-92159-5494",
            "contactType": "sales",
            "areaServed": "BR"
          }
        ]
      }
    </script>
</head>

<body>
    <!-- Header fixo -->
    <header>
        <div class="container nav">
            <div class="brand">
                <img src="assets/logo2.png" alt="Logo Metacraft" />
                <span class="brand-tagline">Transformamos talentos em resultados</span>
            </div>
            <div>
                <a class="btn" href="#contato">Fale conosco</a>
            </div>
        </div>
    </header>


    <!-- Includes das seções -->
    <main>
        <div data-include="hero.html"></div>
        <img src="assets/equipe-em-processo-de-criacao.jpg" alt="Equipe em processo de criação"
            style="width: 50%; display: block; margin: 20px auto;" />
        <div data-include="manifesto.html"></div>
        <img src="assets/programas-de-ia-utilizados-na-sala-servidor-para-garantir-o-desempenho-optimo-sistema.jpg" alt="" style="width: 50%; display: block; margin: 20px auto;" />

        <div data-include="servicos.html"></div>
        <img src="assets/trabalhador-lendo-papelada-em-centro-de-dados-usando-analise.jpg" alt=""
            style="width: 50%; display: block; margin: 20px auto;" />
        <div data-include="diferenciais.html"></div>
        <div data-include="processo.html"></div>
        <div data-include="sobrenos.html"></div> <!-- nova seção -->
        <div data-include="contato.html"></div>
    </main>

    <!-- Footer -->
    <div data-include="footer.html"></div>

    <script>
        // Carrega cada fragmento HTML
        (async () => {
            const slots = document.querySelectorAll("[data-include]");
            for (const slot of slots) {
                const file = slot.getAttribute("data-include");
                try {
                    const res = await fetch(file);
                    slot.innerHTML = await res.text();
                } catch (e) {
                    slot.innerHTML = "<!-- erro ao carregar " + file + " -->";
                }
            }
        })();
    </script>
    <script>
        // Atualiza ano no footer (executa após incluir footer)
        document.addEventListener("DOMContentLoaded", () => {
            const setYear = () => {
                const el = document.getElementById("y");
                if (el) el.textContent = new Date().getFullYear();
                else setTimeout(setYear, 50);
            };
            setYear();
        });
    </script>
</body>

</html>
